main:focus{outline:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}
.dark :focus-visible,.hdr :focus-visible,.dock :focus-visible,.mnav :focus-visible,.ftr :focus-visible{outline-color:var(--mustard)}
.wrap{width:min(100% - 40px,1180px);margin-inline:auto}
.narrow{width:min(100% - 40px,760px)}
.skip{position:absolute;left:12px;top:-60px;z-index:200;background:var(--mustard);color:var(--deep);padding:12px 18px;border-radius:10px;font-weight:800;text-decoration:none}
.skip:focus{top:12px}
.ns{padding:24px;font-family:var(--f-b)}

h1,h2,h3{font-family:var(--f-d);font-weight:800;font-stretch:112%;line-height:1.08;letter-spacing:-.005em}
h1{font-size:clamp(2rem,8vw,3.4rem);font-weight:900}
h2{font-size:clamp(1.65rem,5.6vw,2.6rem)}
h3{font-size:1.2rem}
.serif{font-family:var(--f-s);font-weight:600}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 28px;border-radius:999px;border:2px solid transparent;font:800 16px/1 var(--f-b);text-decoration:none;text-align:center;cursor:pointer;transition:transform .15s,background-color .15s,box-shadow .15s,border-color .15s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--mustard);color:var(--deep)}
.btn-primary:hover{background:#FFC25F;box-shadow:0 8px 22px rgba(254,175,56,.32)}
.btn-wa{background:var(--wa);color:#fff}
.btn-wa:hover{background:var(--wa-2)}
.btn-line{border-color:currentColor;background:transparent}
.btn-line:hover{background:rgba(255,255,255,.1)}
.btn-dark{background:var(--navy);color:#fff}
.btn-dark:hover{background:var(--navy-3)}
.btn-ghost{background:transparent;border-color:var(--line-2);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-sm{min-height:46px;padding:0 20px;font-size:15px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:12px}
.link{color:var(--mustard-ink);font-weight:700;text-underline-offset:4px}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--dark);color:var(--on-dark);box-shadow:0 1px 0 rgba(255,255,255,.08)}
.hdr-in{display:flex;align-items:center;justify-content:space-between;height:68px;gap:12px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff}
.brand img{width:46px;height:46px;border-radius:12px}
.brand-t{display:flex;flex-direction:column}
.brand-n{font:900 22px/1 var(--f-d);font-stretch:125%;letter-spacing:.03em;color:#fff}
.brand-s{font:600 16px/1 var(--f-s);color:var(--mustard);margin-top:4px;letter-spacing:.05em}
.nav{display:none}
.menu-btn{display:inline-flex;align-items:center;gap:10px;min-height:46px;padding:0 18px;border:2px solid rgba(255,255,255,.3);border-radius:999px;background:transparent;color:#fff;font-weight:700}
.burger{width:18px;height:12px;position:relative;display:block}
.burger i{position:absolute;left:0;right:0;height:2px;background:currentColor;border-radius:2px;transition:transform .25s,top .25s}
.burger i:first-child{top:1px}.burger i:last-child{top:9px}
.menu-btn[aria-expanded="true"] .burger i:first-child{top:5px;transform:rotate(45deg)}
.menu-btn[aria-expanded="true"] .burger i:last-child{top:5px;transform:rotate(-45deg)}
.mnav{position:fixed;left:0;right:0;bottom:0;top:calc(68px + env(safe-area-inset-top,0px));background:var(--deep);padding:18px 20px calc(24px + env(safe-area-inset-bottom,0px));overflow:auto;z-index:59;display:flex;flex-direction:column}
.ml{display:block;padding:15px 2px;font:800 clamp(1.6rem,7.4vw,2.3rem)/1.1 var(--f-d);font-stretch:112%;border-bottom:1px solid rgba(255,255,255,.1);text-decoration:none;color:#fff}
.ml[aria-current="page"]{color:var(--mustard)}
.ml.mbook{color:var(--mustard)}
.mn-cta{display:grid;gap:10px;padding-top:26px;margin-top:auto}
.nav ul{display:flex;align-items:center;gap:2px}
.nav a{display:inline-flex;align-items:center;min-height:46px;padding:0 15px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;color:var(--on-dark);position:relative}
.nav a:hover{color:var(--mustard)}
.nav a[aria-current="page"]:not(.nav-book){color:var(--mustard)}
.nav a[aria-current="page"]:not(.nav-book)::after{content:"";position:absolute;left:15px;right:15px;bottom:6px;height:2px;background:var(--mustard);border-radius:2px}
.nav .nav-book{background:var(--mustard);color:var(--deep);font-weight:800;padding:0 24px;margin:0 8px}
.nav .nav-book:hover{background:#FFC25F;color:var(--deep)}
@media(min-width:980px){.nav{display:block}.menu-btn{display:none}.mnav{display:none}}

/* dark surfaces */
.dark{background:var(--dark);color:var(--on-dark)}

/* hero */
.hero{position:relative;overflow:hidden;isolation:isolate;background:radial-gradient(120% 95% at 82% 4%,#2A4E77 0%,var(--dark) 60%)}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-3;opacity:0;transition:opacity .7s}
.hero-bg.ld{opacity:.55}
.hero.has-media::after{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(90deg,rgba(10,28,52,.94) 8%,rgba(10,28,52,.5))}
.hero-art{position:absolute;right:-42%;top:6%;width:min(140vw,900px);height:auto;z-index:-1;pointer-events:none;opacity:.6}
.arc{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2.4s .25s cubic-bezier(.3,.6,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.hero-in{display:grid;gap:40px;padding:40px 0 60px;align-items:center}
.hero-h{font-size:clamp(1.9rem,9.3vw,3.4rem);font-weight:900;font-stretch:120%;line-height:.96;letter-spacing:-.01em;text-transform:uppercase;color:#fff;overflow-wrap:break-word}
.hl{display:block;overflow:hidden;padding:.02em 0 .08em}
.hl>span{display:block;transform:translateY(110%);animation:rise .95s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d,0ms)}
@keyframes rise{to{transform:none}}
.hero-p{margin-top:22px;max-width:34rem;font-size:clamp(1.08rem,4.5vw,1.3rem);line-height:1.5;color:var(--on-dark-2)}
.hero-cta{display:grid;gap:12px;margin-top:30px}
.hero-card{position:relative;isolation:isolate;width:min(62vw,290px);justify-self:center}
.hero-card::before{content:"";position:absolute;inset:16px -16px -16px 16px;border-radius:32px;background:var(--mustard);z-index:-1}
.hero-card img{width:100%;height:auto;aspect-ratio:1;border-radius:32px;box-shadow:0 28px 60px rgba(0,0,0,.45)}
@media(min-width:560px){.hero-cta{display:flex;flex-wrap:wrap}}
@media(min-width:900px){
  .hero-in{grid-template-columns:1.25fr .75fr;min-height:min(82vh,720px);padding:64px 0}
  .hero-h{font-size:clamp(2.6rem,5.6vw,4.6rem)}
  .hero-card{width:min(100%,380px)}
  .hero-art{right:-3%;top:-8%;width:min(64vw,860px);opacity:1}
}

/* strip */
.strip{background:var(--bg-2);border-bottom:1px solid var(--line)}
.strip-in>div{padding:18px 0;border-bottom:1px solid var(--line)}
.strip-in>div:last-child{border-bottom:0}
.st-k{font-weight:800;font-size:15px;color:var(--mustard-ink)}
.st-v{font-size:1.06rem;font-weight:500;margin-top:2px}
@media(min-width:800px){
  .strip-in{display:grid;grid-template-columns:repeat(3,1fr)}
  .strip-in>div{padding:26px 30px;border-bottom:0;border-right:1px solid var(--line)}
  .strip-in>div:first-child{padding-left:0}
  .strip-in>div:last-child{border-right:0}
}

/* sections */
.sec{padding:clamp(52px,9vw,100px) 0}
.sec-alt{background:var(--bg-2)}
.sec-h{max-width:42rem;margin-bottom:clamp(26px,5vw,44px)}
.sec-h p{margin-top:12px;color:var(--ink-2);font-size:1.08rem}
.more{margin-top:28px}

/* category cards */
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:760px){.cats{grid-template-columns:repeat(4,1fr);gap:18px}}
.cat{position:relative;display:block;aspect-ratio:4/5;border-radius:22px;overflow:hidden;text-decoration:none;color:#fff;isolation:isolate;background:var(--navy-2)}
.cat-art{position:absolute;inset:0;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.cat-art>svg,.cat-art>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cat-art>img{opacity:0;transition:opacity .4s}.cat-art>img.ld{opacity:1}
.cat:hover .cat-art{transform:scale(1.05)}
.cat::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 42%,rgba(6,16,32,.88));z-index:1}
.cat-t{position:absolute;left:16px;right:14px;bottom:16px;z-index:2}
.cat-t h3{font-size:clamp(1.02rem,4.5vw,1.45rem);color:#fff;overflow-wrap:break-word}
.cat-t p{font:600 1.1rem/1.1 var(--f-s);color:var(--mustard);margin-top:6px}

/* why */
.why-i{padding:22px 0 24px;border-top:2px solid var(--mustard)}
.why-i p{margin-top:8px;color:var(--ink-2)}
@media(min-width:760px){.why{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 40px}}

/* gallery */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:0 20px;border-radius:999px;border:2px solid var(--line-2);background:var(--card);font-weight:700;font-size:15px;transition:background-color .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-ink)}
.gal{columns:2;column-gap:12px}
#gal{margin-top:24px}
@media(min-width:760px){.gal{columns:3;column-gap:16px}}
@media(min-width:1100px){.gal{columns:4}}
.tile{position:relative;display:block;width:100%;margin:0 0 12px;padding:0;border:0;border-radius:14px;overflow:hidden;background:linear-gradient(160deg,var(--navy-3),var(--navy));break-inside:avoid;color:#fff;text-align:left}
@media(min-width:760px){.tile{margin-bottom:16px}}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s,transform .6s}
.tile img.ld{opacity:1}
.tile:hover img{transform:scale(1.04)}
.tile-play{position:absolute;left:12px;bottom:12px;padding:9px 18px;border-radius:999px;background:var(--mustard);color:var(--deep);font-weight:800;font-size:14px}
.tile-cap{position:absolute;left:0;right:0;top:0;padding:26px 14px 10px;font-size:14px;font-weight:600;background:linear-gradient(180deg,rgba(6,16,32,.7),transparent);opacity:0;transition:opacity .2s}
.tile:hover .tile-cap,.tile:focus-visible .tile-cap{opacity:1}
.empty{padding:34px 24px;border:2px dashed var(--line-2);border-radius:18px;color:var(--ink-2);text-align:center}
.empty p+p{margin-top:8px}
.empty .btn-row{justify-content:center;margin-top:18px}

/* page head */
.phead{position:relative;overflow:hidden;isolation:isolate;padding:38px 0 clamp(36px,7vw,64px)}
.phead>svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1;object-fit:cover}
.phead::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(10,28,52,.9) 20%,rgba(10,28,52,.35))}
.phead .back{display:inline-block;margin-bottom:18px;font-weight:700;color:var(--mustard);text-underline-offset:4px}
.phead p.lead{margin-top:14px;max-width:38rem;font-size:clamp(1.05rem,4.2vw,1.25rem);color:var(--on-dark-2)}
.phead .btn-row{margin-top:26px}

/* treatment menu */
.menu li{padding:24px 0;border-bottom:1px solid var(--line)}
.menu li:first-child{border-top:1px solid var(--line)}
.tr-top{display:flex;align-items:baseline;gap:12px}
.tr-name{font-size:clamp(1.15rem,4.6vw,1.5rem)}
.tr-lead{flex:1;min-width:14px;border-bottom:2px dotted var(--line-2);transform:translateY(-5px)}
.tr-price{font:800 1.1rem/1.1 var(--f-d);white-space:nowrap}
.tr-price.ask{font:600 1.3rem/1.1 var(--f-s);color:var(--mustard-ink)}
.tr-desc{margin-top:8px;color:var(--ink-2);max-width:44rem}
.tr-meta{margin-top:6px;font-weight:700;font-size:.95rem;color:var(--mustard-ink)}
.tr-act{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
@media(min-width:760px){
  .menu li{display:grid;grid-template-columns:1fr auto;column-gap:32px;align-items:center;padding:18px 0}
  .menu li .tr-act{grid-column:2;grid-row:1 / span 3;margin-top:0}
}
.others{margin-top:clamp(40px,7vw,64px)}
.others h2{font-size:1.4rem;margin-bottom:14px}
.others a.chip{display:inline-flex;align-items:center;text-decoration:none}
.block-h{margin:clamp(40px,7vw,64px) 0 18px}

/* find us */
.find{display:grid;gap:18px}
@media(min-width:900px){.find{grid-template-columns:1.25fr .75fr;gap:24px}}
.mapc{position:relative;display:flex;flex-direction:column;border-radius:26px;overflow:hidden;color:#fff;background:var(--navy)}
.mapc-map{position:relative;flex:1;min-height:300px;isolation:isolate;background:var(--navy-2)}
.mapc-map>svg{position:absolute;inset:0;width:100%;height:100%}
.mapf{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .5s}
.mapf.ok{opacity:1}
.mapf.bad{display:none}
.mapc-in{padding:22px 24px 26px;background:var(--navy)}
.mapc-in h3{font-size:clamp(1.25rem,5vw,1.7rem);color:#fff}
.mapc-in p{color:var(--on-dark);margin-top:2px}
.mapc-in .lm{color:var(--on-dark-2);font-size:.98rem;margin-top:6px}
.mapc .btn-row{margin-top:16px}
.mapc .vl{display:inline-block;margin-top:16px;color:var(--mustard);font-weight:700;text-underline-offset:4px}
.hours{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px}
.hours h3{margin-bottom:2px}
.hours .sub{font:600 1.15rem var(--f-s);color:var(--mustard-ink);margin-bottom:14px}
.hours dl{display:grid;gap:0}
.hrow{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow dt{font-weight:600}
.hrow dd{color:var(--ink-2);text-align:right}
.hrow.today{background:linear-gradient(90deg,rgba(254,175,56,.2),transparent);margin:0 -12px;padding:11px 12px;border-radius:8px;border-bottom-color:transparent}
.tg{margin-left:10px;padding:2px 10px;border-radius:999px;background:var(--mustard);color:var(--deep);font-weight:800;font-size:.75rem;vertical-align:middle}

/* reviews */
.revs{display:grid;gap:14px}
@media(min-width:760px){.revs{grid-template-columns:repeat(3,1fr);gap:18px}}
.rev{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px}
.rev blockquote{margin:0;font-size:1.05rem}
.rev-by{display:flex;align-items:center;gap:12px;margin-top:auto;font-weight:800}
.rev-by img{width:44px;height:44px;border-radius:50%;object-fit:cover}
.rate{display:inline-flex;gap:4px}
.rate i{display:block;width:22px;height:6px;border-radius:3px;background:var(--line-2)}
.rate i.on{background:var(--mustard)}
.rate-t{font-weight:700;font-size:.9rem;color:var(--ink-2);margin-left:8px}
.rev-cta{margin-top:26px}

/* cta band */
.band{position:relative;overflow:hidden;isolation:isolate;padding:clamp(52px,9vw,88px) 0}
.band>svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.band::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(10,28,52,.95) 32%,rgba(10,28,52,.25))}
@media(max-width:700px){.band::after{background:rgba(10,28,52,.82)}}
.band h2{max-width:26rem;font-size:clamp(1.9rem,7vw,3rem)}
.band p{margin-top:12px;max-width:30rem;color:var(--on-dark-2)}
.band .btn-row{margin-top:26px}

/* footer */
.ftr{background:var(--deep);color:var(--on-dark);padding:clamp(44px,8vw,72px) 0 112px}
.is-admin .ftr{padding-bottom:28px}
@media(min-width:980px){.ftr{padding-bottom:28px}}
.ftr-grid{display:grid;gap:34px}
@media(min-width:800px){.ftr-grid{grid-template-columns:1.4fr 1fr 1fr 1fr}}
.ftr .brand{margin-bottom:14px}
.ftr p{color:var(--on-dark-2);max-width:24rem}
.ftr .fh{font:800 1rem var(--f-d);font-stretch:112%;margin:0 0 12px;color:#fff}
.ftr li a{display:inline-block;padding:7px 0;text-decoration:none;color:var(--on-dark-2)}
.ftr li a:hover{color:var(--mustard)}
.ftr .ftr-legal{max-width:none;margin-top:40px;padding-top:20px;border-top:1px solid rgba(255,255,255,.12);font-size:.95rem;color:var(--on-dark-2)}

/* dock and float */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:70;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--deep);box-shadow:0 -10px 30px rgba(0,0,0,.28)}
.dock a{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:14px;text-decoration:none;font-weight:800;font-size:14px;text-align:center;color:#fff;border:2px solid rgba(255,255,255,.28)}
.dock a.d-book{background:var(--mustard);border-color:var(--mustard);color:var(--deep);flex:1.2}
.dock a.d-wa{background:var(--wa);border-color:var(--wa)}
.lock .dock{display:none}
.wa-float{display:none}
@media(min-width:980px){
  .dock{display:none}
  .wa-float{display:inline-flex;position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:70;min-height:56px;align-items:center;padding:0 26px;border-radius:999px;background:var(--wa);color:#fff;font-weight:800;text-decoration:none;box-shadow:0 12px 32px rgba(0,0,0,.3);transition:transform .15s,background-color .15s}
  .wa-float:hover{background:var(--wa-2);transform:translateY(-2px)}
}

/* booking */
.bk-sec{border:0;padding:0;margin:0 0 34px;min-width:0}
.bk-sec legend{font:800 1.3rem var(--f-d);font-stretch:112%;padding:0;margin-bottom:14px}
.bk-sec .hint{margin:-6px 0 14px;color:var(--ink-2);font-size:.98rem}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:14px;text-align:left;min-height:58px;padding:12px 18px;border:2px solid var(--line-2);border-radius:16px;background:var(--card);transition:border-color .15s,background-color .15s}
.opt:hover{border-color:var(--ink)}
.opt[aria-checked="true"]{border-color:var(--sel-bg);background:var(--sel-bg);color:var(--sel-ink)}
.opt b{font-weight:700}
.opt small{display:block;font-weight:500;font-size:.9rem;opacity:.8}
.opt span.pr{font-weight:800;white-space:nowrap;font-size:.95rem}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scroll-snap-type:x proximity}
.day{flex:0 0 auto;scroll-snap-align:start;min-width:82px;min-height:70px;display:grid;place-items:center;align-content:center;gap:2px;padding:8px 12px;border:2px solid var(--line-2);border-radius:16px;background:var(--card);font-weight:700;line-height:1.2}
.day small{font-weight:500;font-size:.82rem;opacity:.85}
.day[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-ink)}
.day[disabled]{opacity:.45;cursor:not-allowed;text-decoration:line-through}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:560px){.slots{grid-template-columns:repeat(5,1fr)}}
.slot{min-height:50px;border:2px solid var(--line-2);border-radius:12px;background:var(--card);font-weight:700;font-size:15px}
.slot[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-ink)}
.fld{display:grid;gap:6px;margin-bottom:16px}
.fld label{font-weight:700;font-size:.98rem}
.inp{width:100%;min-height:54px;padding:0 16px;border:2px solid var(--line-2);border-radius:12px;background:var(--card);font-size:17px}
textarea.inp{padding:12px 16px;min-height:130px;resize:vertical;line-height:1.5}
select.inp{padding-right:10px}
.inp:focus{border-color:var(--navy);outline:0;box-shadow:0 0 0 4px rgba(254,175,56,.45)}
.err{color:var(--err);font-weight:700;margin:6px 0 14px}
.err:empty{display:none}
.ticket{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:clamp(22px,5vw,36px)}
.ticket dl{display:grid;gap:0;margin:20px 0}
.ticket dl>div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:2px dotted var(--line-2)}
.ticket dt{color:var(--ink-2)}
.ticket dd{font-weight:700;text-align:right}
.msg{white-space:pre-wrap;background:var(--bg-2);border-radius:14px;padding:16px;font-size:.98rem;color:var(--ink-2);margin:0 0 20px}
.note{font-size:.95rem;color:var(--ink-2);margin-top:10px}

/* contact */
.cgrid{display:grid;gap:34px}
@media(min-width:900px){.cgrid{grid-template-columns:1fr 1fr;gap:56px}}
.clist{display:grid;gap:0;margin-bottom:28px}
.clist>div{padding:14px 0;border-bottom:1px solid var(--line)}
.clist dt{font-weight:800;font-size:.95rem;color:var(--mustard-ink)}
.clist dd{font-size:1.1rem;font-weight:500}
.clist a{text-underline-offset:4px}

/* lightbox, modal, toast */
.lb{position:fixed;inset:0;z-index:100;background:rgba(5,15,32,.97);display:grid;grid-template-rows:auto 1fr auto;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);color:#fff}
.lb-top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;gap:12px}
.lb-top span{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-fig{display:grid;place-items:center;min-height:0;padding:0 12px}
.lb-fig img,.lb-fig video{max-height:100%;max-width:100%;width:auto;height:auto;object-fit:contain;border-radius:10px;background:#000}
.lb-nav{display:flex;justify-content:center;gap:12px;padding:14px 16px}
.lb .btn{min-height:48px;padding:0 24px}
.modal{position:fixed;inset:0;z-index:110;background:rgba(5,15,32,.7);display:grid;place-items:end center;padding:0}
@media(min-width:640px){.modal{place-items:center;padding:24px}}
.modal-b{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--bg);color:var(--ink);border-radius:24px 24px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom,0px))}
@media(min-width:640px){.modal-b{border-radius:24px}}
.modal-b h2{font-size:1.6rem;margin-bottom:6px}
.modal-b .btn-row{margin-top:8px}
.toast{position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:120;background:var(--mustard);color:var(--deep);font-weight:800;padding:14px 22px;border-radius:999px;box-shadow:0 12px 30px rgba(0,0,0,.3);max-width:calc(100% - 32px);text-align:center}
.toast.bad{background:var(--err);color:#fff}

/* admin */
.adm{padding:24px 0 80px}
.adm-bar{position:sticky;top:calc(68px + env(safe-area-inset-top,0px));z-index:40;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:22px}
.adm-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.adm-tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px}
.adm-tabs .chip{flex:0 0 auto;min-height:44px}
.adm-st{font-weight:700;font-size:.95rem;color:var(--ink-2)}
.adm-st.dirty{color:var(--mustard-ink)}
.adm h1{font-size:clamp(1.6rem,5vw,2.2rem);margin-bottom:6px}
.adm h2{font-size:1.35rem;margin-bottom:10px}
.adm h3{font-size:1.1rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:18px}
.panel>h2:first-child,.panel>h3:first-child{margin-top:0}
.g2{display:grid;gap:0 18px}
@media(min-width:720px){.g2{grid-template-columns:1fr 1fr}}
.split{display:grid;gap:18px}
@media(min-width:900px){.split{grid-template-columns:260px 1fr;align-items:start}}
.cl{display:flex;flex-direction:column;gap:6px}
.cl button{text-align:left;min-height:48px;padding:0 16px;border:2px solid var(--line);border-radius:12px;background:var(--card);font-weight:700}
.cl button[aria-current="true"]{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-ink)}
.it{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;background:var(--bg)}
.it-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts .btn{min-height:42px;padding:0 16px;font-size:14px}
.btn-danger{background:transparent;border-color:var(--err);color:var(--err)}
.btn-danger:hover{background:var(--err);color:#fff}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600}
.chk input{width:22px;height:22px;accent-color:var(--navy)}
.status{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.status:last-child{border-bottom:0}
.status b.ok{color:var(--ok)}
.status b.todo{color:var(--err)}
.thumbs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:720px){.thumbs{grid-template-columns:repeat(3,1fr)}}
.th{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}
.th-i{position:relative;aspect-ratio:1;background:linear-gradient(160deg,var(--navy-3),var(--navy))}
.th-i img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.th-i span{position:absolute;left:8px;top:8px;background:var(--mustard);color:var(--deep);font-weight:800;font-size:12px;padding:3px 10px;border-radius:999px}
.th-b{padding:10px}
.th-b .inp{min-height:44px;font-size:15px;margin-bottom:8px}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:8px 0}
.meter i{display:block;height:100%;background:var(--mustard)}
.hed{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.hed .inp{min-height:48px}
@media(min-width:720px){.hed{grid-template-columns:120px 110px 1fr 1fr}}
.steps{list-style:decimal;padding-left:22px;display:grid;gap:6px}
.lockmsg{max-width:36rem;margin:60px auto;text-align:center}
.lockmsg p{margin:12px 0 24px;color:var(--ink-2)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  .hl>span{transform:none}.arc{stroke-dashoffset:0}
}
</style>
</head>

/* ---------- shared UI state ---------- */
let BK = { cat: '', svc: '', date: '', time: '', name: '', phone: '', done: false };
let CT = { name: '', phone: '', msg: '' };
let RV = { rating: 5, name: '', text: '' };
let LB = null;
let LASTFOCUS = null;

/* ---------- media hydration ---------- */
function applyMedia(scope) {
  $$('[data-mid]', scope || DOC).forEach(el => {
    const src = MEDIA[el.dataset.mid];
    if (!src) return;
    if (el.tagName === 'VIDEO') {
      if (el.getAttribute('src') !== src) {
        el.src = src;
        const p = MEDIA[el.dataset.poster];
        if (p) el.poster = p;
      }
      if (el.hasAttribute('autoplay')) {
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) el.removeAttribute('autoplay');
        else { const pr = el.play(); if (pr && pr.catch) pr.catch(() => {}); }
      }
    } else {
      if (el.getAttribute('src') !== src) el.src = src;
      if (el.dataset.alt) el.alt = el.dataset.alt;
    }
    el.classList.add('ld');
  });
}
function loadMedia() {
  const el = $('#media-data');
  if (!el || !el.textContent.trim()) return;
  try { Object.assign(MEDIA, JSON.parse(el.textContent)); } catch (e) { /* ignore */ }
  el.textContent = '';
  applyMedia(DOC);
}

/* ---------- toast and modal ---------- */
function toast(msg, bad) {
  $$('.toast').forEach(x => x.remove());
  const t = DOC.createElement('div');
  t.className = 'toast' + (bad ? ' bad' : '');
  t.setAttribute('role', 'status');
  t.textContent = msg;
  DOC.body.appendChild(t);
  setTimeout(() => t.remove(), bad ? 7000 : 3500);
}
function openModal(html) {
  closeModal();
  const m = DOC.createElement('div');
  m.className = 'modal';
  m.id = 'modal';
  m.innerHTML = `<div class="modal-b" role="dialog" aria-modal="true" aria-labelledby="mt">${html}</div>`;
  m.addEventListener('click', e => { if (e.target === m) closeModal(); });
  LASTFOCUS = DOC.activeElement;
  DOC.body.appendChild(m);
  DOC.documentElement.classList.add('lock');
  const first = $('input,button,textarea', m);
  if (first) first.focus();
}
function closeModal() {
  const m = $('#modal');
  if (!m) return;
  m.remove();
  DOC.documentElement.classList.remove('lock');
  if (LASTFOCUS && LASTFOCUS.focus) LASTFOCUS.focus({ preventScroll: true });
}

/* partial re-render that keeps keyboard focus on the same control */
function focusKey(el) { return el && el.dataset ? [el.dataset.act, el.dataset.id, el.dataset.t, el.dataset.d, el.dataset.f].join('|') : ''; }
function rerender(sel, html) {
  const box = $(sel);
  if (!box) return;
  const key = focusKey(DOC.activeElement);
  box.innerHTML = html;
  applyMedia(box);
  if (key && key !== '|||||') {
    const n = $$('[data-act]', box).find(x => focusKey(x) === key);
    if (n) n.focus({ preventScroll: true });
  }
}

/* ---------- lightbox ---------- */
function openLB(key, i) {
  const list = LISTS[key];
  if (!list || !list[i]) return;
  LB = { list, i };
  LASTFOCUS = DOC.activeElement;
  DOC.documentElement.classList.add('lock');
  let el = $('#lb');
  if (!el) {
    el = DOC.createElement('div');
    el.id = 'lb';
    el.className = 'lb';
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-modal', 'true');
    el.setAttribute('aria-label', 'Media viewer');
    DOC.body.appendChild(el);
    let sx = 0;
    el.addEventListener('touchstart', e => { sx = e.changedTouches[0].clientX; }, { passive: true });
    el.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - sx;
      if (Math.abs(dx) > 60) stepLB(dx < 0 ? 1 : -1);
    }, { passive: true });
  }
  drawLB();
  const x = $('[data-act="lb-x"]', el);
  if (x) x.focus();
}
function drawLB() {
  const m = LB.list[LB.i], el = $('#lb'), v = m.type === 'video', many = LB.list.length > 1;
  el.innerHTML = `<div class="lb-top"><span>${esc(m.caption || '')}</span><button type="button" class="btn btn-primary" data-act="lb-x">Close</button></div>
<div class="lb-fig">${v ? `<video controls autoplay playsinline data-mid="${esc(m.id)}" data-poster="${esc(m.id)}_p"></video>` : `<img data-mid="${esc(m.id)}" data-alt="${esc(m.caption || 'Photo')}" alt="">`}</div>
<div class="lb-nav">${many ? '<button type="button" class="btn btn-line" data-act="lb-p">Previous</button><button type="button" class="btn btn-line" data-act="lb-n">Next</button>' : ''}</div>`;
  applyMedia(el);
}
function stepLB(d) {
  if (!LB || LB.list.length < 2) return;
  LB.i = (LB.i + d + LB.list.length) % LB.list.length;
  drawLB();
}
function closeLB() {
  const el = $('#lb');
  if (el) el.remove();
  LB = null;
  DOC.documentElement.classList.remove('lock');
  if (LASTFOCUS && LASTFOCUS.focus) LASTFOCUS.focus({ preventScroll: true });
}

/* ---------- booking ---------- */
function slotsFor(ds) {
  const d = fromYmd(ds), h = S.settings.hours[hIdx(d)];
  if (h && h.closed) return { closed: true, slots: [] };
  const a = ((h && h.open) || '08:00').split(':').map(Number), b = ((h && h.close) || '20:00').split(':').map(Number);
  const now = new Date(), isToday = ds === ymd(now), nm = now.getHours() * 60 + now.getMinutes() + 30, end = b[0] * 60 + b[1], out = [];
  for (let m = a[0] * 60 + a[1]; m <= end - 30; m += 30) {
    if (isToday && m < nm) continue;
    out.push(pad(Math.floor(m / 60)) + ':' + pad(m % 60));
  }
  return { closed: false, slots: out };
}
function bkWhat() {
  const c = cat(BK.cat), x = BK.svc && S.services.find(s => s.id === BK.svc);
  if (x) return x.name;
  return c ? catPhrase(c) : 'an appointment';
}

  return `Hello ${bn()}. I would like to book ${bkWhat()} on ${dayLong(fromYmd(BK.date))} at ${t12(BK.time)}. My name is ${BK.name.trim()} and my phone number is ${BK.phone.trim()}. Please confirm availability.`;
}
function bkErrors() {
  const e = [];
  if (!BK.cat) e.push('Choose a service.');
  if (!BK.date) e.push('Pick a date.');
  if (!BK.time) e.push('Pick a time.');
  if (!BK.name.trim()) e.push('Enter your name.');
  if (String(BK.phone).replace(/\D/g, '').length < 9) e.push('Enter a valid phone number.');
  return e;
}

function bookDone() {
  const c = cat(BK.cat), d = fromYmd(BK.date), msg = msgBooking();

/* ---------- admin ---------- */
const ADM = { tab: 'overview', cat: '', gcat: 'all', upCat: '', del: '' };
const TABS = [['overview', 'Overview'], ['services', 'Services'], ['gallery', 'Gallery'], ['reviews', 'Reviews'], ['bookings', 'Bookings'], ['settings', 'Settings']];
const LIMIT = STANDALONE ? 1e9 : 15300000;
const VMAX = STANDALONE ? 25 : 6.5;
let ADM_CHECKED = false;
let DL = null;
let LED = [];
let NB = { svc: '', date: '', time: '', name: '', phone: '', notes: '' };
try { LED = JSON.parse(localStorage.getItem('nadra-ledger') || '[]'); } catch (e) { LED = []; }
function saveLed() { try { localStorage.setItem('nadra-ledger', JSON.stringify(LED)); } catch (e) { toast('Could not save the booking log on this device.', true); } }

function markDirty() {
  DIRTY = true;
  const st = $('#adm-st');
  if (st) { st.textContent = STANDALONE ? 'Changes not downloaded yet' : 'Unpublished changes'; st.classList.add('dirty'); }
}
function usedBytes() {
  let n = JSON.stringify(S).length + 120000;
  S.media.forEach(m => { n += (MEDIA[m.id] || '').length; if (m.type === 'video') n += (MEDIA[m.id + '_p'] || '').length; });
  S.reviews.forEach(r => { if (r.photo) n += (MEDIA[r.photo] || '').length; });
  return n;
}
function meter() {
  if (STANDALONE) return '';
  const u = usedBytes(), p = Math.min(100, Math.round(u / LIMIT * 100));
  return `<div class="meter" role="img" aria-label="${p} percent of site storage used"><i style="width:${p}%"></i></div><p class="note" style="margin-top:0">${(u / 1048576).toFixed(1)} MB of ${(LIMIT / 1048576).toFixed(0)} MB used. Photos and videos are stored inside the page.</p>`;
}

/* ---------- field helper ---------- */
function fld(label, k, val, o) {
  o = o || {};
  const id = 'f-' + k.replace(/[^\w]/g, '-');
  const r = o.r ? ` data-r="${o.r}"` : '';
  const input = o.area
    ? `<textarea class="inp" id="${id}" data-k="${esc(k)}"${r}>${esc(val)}</textarea>`
    : `<input class="inp" id="${id}" data-k="${esc(k)}"${r} type="${o.type || 'text'}"${o.ph ? ` placeholder="${esc(o.ph)}"` : ''}${o.mode ? ` inputmode="${o.mode}"` : ''} value="${esc(val)}">`;
  return `<div class="fld"><label for="${id}">${label}</label>${input}${o.hint ? `<p class="note" style="margin:0">${o.hint}</p>` : ''}</div>`;
}
function chk(label, k, on, r) {
  return `<label class="chk"><input type="checkbox" data-k="${esc(k)}"${r ? ` data-r="${r}"` : ''}${on ? ' checked' : ''}> ${label}</label>`;
}
function delBtn(kind, id, label) {
  const key = kind + ':' + id;
  return ADM.del === key
    ? `<button type="button" class="btn btn-danger" data-act="del-go" data-kind="${kind}" data-id="${esc(id)}">Confirm delete</button><button type="button" class="btn btn-ghost" data-act="del-x">Cancel</button>`
    : `<button type="button" class="btn btn-danger" data-act="del" data-kind="${kind}" data-id="${esc(id)}">${label || 'Delete'}</button>`;
}

  return `<div class="adm-bar"><div class="adm-row"><div class="adm-tabs" role="group" aria-label="Admin sections">${TABS.map(t => `<button type="button" class="chip" data-act="adm-tab" data-id="${t[0]}" aria-pressed="${ADM.tab === t[0]}">${t[1]}</button>`).join('')}</div>
<div class="acts"><span class="adm-st${DIRTY ? ' dirty' : ''}" id="adm-st" role="status">${DIRTY ? (STANDALONE ? 'Changes not downloaded yet' : 'Unpublished changes') : (STANDALONE ? 'No changes' : 'No unpublished changes')}</span>${STANDALONE ? '<button type="button" class="btn btn-primary btn-sm" data-act="pkg" id="adm-pub">Download for Netlify</button>' : '<button type="button" class="btn btn-primary btn-sm" data-act="publish" id="adm-pub">Publish changes</button>'}</div></div></div>`;

/* ---------- binding ---------- */
function admBind(el) {
  const k = el.dataset.k;
  if (!k) return false;
  const p = k.split(':'), kind = p[0], v = el.type === 'checkbox' ? el.checked : el.value;
  if (kind === 'set') S.settings[p[1]] = v;
  else if (kind === 'hr') S.settings.hours[+p[1]][p[2]] = v;
  else if (kind === 'hl') S.settings.highlights[+p[1]][p[2]] = v;
  else if (kind === 'about') S.settings.about[+p[1]] = v;
  else if (kind === 'bk') { const e = LED.find(x => x.id === p[1]); if (e) { e[p[2]] = v; saveLed(); } return true; }
  else {
    const list = { cat: S.categories, svc: S.services, rev: S.reviews, med: S.media }[kind], o = list && list.find(x => x.id === p[1]);
    if (o) o[p[2]] = p[2] === 'rating' ? +v : v;
  }
  markDirty();
  return true;
}

/* ---------- upload pipeline ---------- */
function readDataURL(file, videoFallback) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { let d = String(r.result); if (videoFallback && !/^data:video\//.test(d)) d = d.replace(/^data:[^;,]*/, 'data:video/mp4'); res(d); };
    r.onerror = () => rej(new Error('Could not read ' + file.name + '.'));
    r.readAsDataURL(file);
  });
}
function loadImg(src, name) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Could not open ' + name + '. Use a JPG, PNG or WebP photo.')); i.src = src; });
}
async function shrink(file, maxSide, q) {
  const im = await loadImg(await readDataURL(file), file.name);
  const k = Math.min(1, maxSide / Math.max(im.naturalWidth, im.naturalHeight)), w = Math.round(im.naturalWidth * k), h = Math.round(im.naturalHeight * k);
  const c = DOC.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(im, 0, 0, w, h);
  return { data: c.toDataURL('image/jpeg', q), w, h };
}
function videoPoster(src, name) {
  return new Promise((res, rej) => {
    const v = DOC.createElement('video');
    v.muted = true; v.playsInline = true; v.preload = 'auto';
    const t = setTimeout(() => rej(new Error('Could not read ' + name + '. Try an MP4 video.')), 20000);
    v.onloadeddata = () => { try { v.currentTime = Math.min(0.4, (v.duration || 1) / 2); } catch (e) { /* ignore */ } };
    v.onseeked = () => {
      clearTimeout(t);
      const w = v.videoWidth, h = v.videoHeight, k = Math.min(1, 480 / Math.max(w, h)), c = DOC.createElement('canvas');
      c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
      res({ poster: c.toDataURL('image/jpeg', 0.7), w, h });
    };
    v.onerror = () => { clearTimeout(t); rej(new Error('Could not read ' + name + '. Try an MP4 video.')); };
    v.src = src;
  });
}
function removeMedia(id) {
  const i = S.media.findIndex(m => m.id === id);
  if (i < 0) return;
  S.media.splice(i, 1);
  delete MEDIA[id]; delete MEDIA[id + '_p'];
  S.categories.forEach(c => { if (c.cover === id) c.cover = ''; });
}
async function addFile(file, kind, target) {
  const isVid = /^video\//.test(file.type) || /\.(mp4|mov|webm|m4v)$/i.test(file.name);
  const isImg = /^image\//.test(file.type) || /\.(jpe?g|png|webp|gif)$/i.test(file.name);
  if (!isVid && !isImg) throw new Error(file.name + ' is not a photo or video.');
  if (kind === 'review') {
    if (!isImg) throw new Error('Choose a photo for the review.');
    const r = await shrink(file, 240, 0.8), id = uid('rp'), rv = S.reviews.find(x => x.id === target);
    if (!rv) return;
    if (rv.photo) delete MEDIA[rv.photo];
    MEDIA[id] = r.data; rv.photo = id;
    markDirty();
    return;
  }
  const cid = kind === 'hero' ? '_hero' : ADM.upCat;
  if (!cid) throw new Error('Add a category first.');
  let data, poster = '', w, h;
  if (isVid) {
    if (file.size > VMAX * 1048576) throw new Error(file.name + ' is larger than ' + Math.floor(VMAX) + ' MB. Trim or compress it, then try again.');
    data = await readDataURL(file, true);
    const p = await videoPoster(data, file.name);
    poster = p.poster; w = p.w; h = p.h;
  } else {
    const r = await shrink(file, kind === 'hero' ? 1800 : 1200, 0.78);
    data = r.data; w = r.w; h = r.h;
  }
  if (usedBytes() + data.length + poster.length > LIMIT) throw new Error('There is not enough space left. Delete some media, then try again.');
  if (kind === 'hero') { const old = heroMedia(); if (old) removeMedia(old.id); }
  const id = uid('m');
  S.media.push({ id, cat: cid, type: isVid ? 'video' : 'image', caption: '', w, h });
  MEDIA[id] = data;
  if (isVid) MEDIA[id + '_p'] = poster;
  markDirty();
}
async function handleUpload(input) {
  const files = Array.from(input.files || []), kind = input.dataset.up;
  if (!files.length) return;
  const st = $('#up-st');
  let ok = 0;
  for (let i = 0; i < files.length; i++) {
    if (st) st.textContent = 'Adding ' + (i + 1) + ' of ' + files.length + ': ' + files[i].name;
    try { await addFile(files[i], kind, input.dataset.id); ok++; } catch (e) { toast(e.message || 'Could not add ' + files[i].name, true); }
  }
  input.value = '';
  admRender();
  if (ok) toast(ok === 1 ? 'Added. Press Publish changes to make it live.' : ok + ' files added. Press Publish changes to make them live.');
}

/* ---------- structure helpers ---------- */
function swap(list, id, dir, same) {
  const idx = list.map((x, i) => i).filter(i => same(list[i]));
  const pos = idx.findIndex(i => list[i].id === id), j = pos + dir;
  if (pos < 0 || j < 0 || j >= idx.length) return;
  const a = idx[pos], b = idx[j], t = list[a];
  list[a] = list[b]; list[b] = t;
}
function deleteItem(kind, id) {
  if (kind === 'cat') {
    S.media.filter(m => m.cat === id).forEach(m => removeMedia(m.id));
    S.services = S.services.filter(x => x.cat !== id);
    S.categories = S.categories.filter(c => c.id !== id);
  } else if (kind === 'svc') S.services = S.services.filter(x => x.id !== id);
  else if (kind === 'med') removeMedia(id);
  else if (kind === 'rev') { const r = S.reviews.find(x => x.id === id); if (r && r.photo) delete MEDIA[r.photo]; S.reviews = S.reviews.filter(x => x.id !== id); }
  else if (kind === 'bkl') { LED = LED.filter(x => x.id !== id); saveLed(); return; }
  markDirty();
}

/* ---------- publish and export ---------- */
const EXT = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/gif': 'gif', 'video/mp4': 'mp4', 'video/webm': 'webm', 'video/quicktime': 'mov' };
async function mediaBytes(v) {
  if (/^data:/.test(v)) {
    const i = v.indexOf(','), mime = v.slice(5, i).split(';')[0], bin = atob(v.slice(i + 1)), u8 = new Uint8Array(bin.length);
    for (let k = 0; k < bin.length; k++) u8[k] = bin.charCodeAt(k);
    return { bytes: u8, ext: EXT[mime] || 'bin' };
  }
  const r = await fetch(v);
  if (!r.ok) throw new Error('Could not read the existing file ' + v + '. Nothing was downloaded.');
  const m = String(v).match(/\.(\w+)(\?|$)/);
  return { bytes: new Uint8Array(await r.arrayBuffer()), ext: m ? m[1].toLowerCase() : (EXT[(r.headers.get('content-type') || '').split(';')[0]] || 'bin') };
}
async function packageFiles() {
  const s = S.settings, enc = new TextEncoder(), files = [], urls = {}, keys = [];
  S.media.forEach(m => { keys.push(m.id); if (m.type === 'video') keys.push(m.id + '_p'); });
  S.reviews.forEach(r => { if (r.photo) keys.push(r.photo); });
  for (const k of keys) {
    if (!MEDIA[k]) continue;
    const got = await mediaBytes(MEDIA[k]), path = 'media/' + k + '.' + got.ext;
    files.push({ name: path, data: got.bytes });
    urls[k] = path;
  }
  const html = buildDocument($('#app-css').textContent, $('#app-js').textContent, S, urls);
  let site = String(s.siteUrl || '').trim();
  if (site && !/\/$/.test(site)) site += '/';
  const out = [{ name: 'index.html', data: enc.encode(html) }, { name: 'logo.jpg', data: (await mediaBytes(s.logoLg)).bytes }];
  out.push({ name: 'robots.txt', data: enc.encode('User-agent: *\nAllow: /\n' + (site ? 'Sitemap: ' + site + 'sitemap.xml\n' : '')) });
  if (site) out.push({ name: 'sitemap.xml', data: enc.encode('<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>' + site + '</loc><lastmod>' + ymd(new Date()) + '</lastmod></url></urlset>\n') });
  out.push({ name: '_headers', data: enc.encode('/media/*\n  Cache-Control: public, max-age=31536000, immutable\n\n/*\n  X-Content-Type-Options: nosniff\n  Referrer-Policy: strict-origin-when-cross-origin\n') });
  return out.concat(files);
}
async function exportPackage() {
  if (!STANDALONE && !DL) { toast('Downloading is not available in this view.', true); return; }
  const btns = $$('[data-act="pkg"]'), labels = btns.map(b => b.textContent);
  btns.forEach(b => { b.disabled = true; b.textContent = 'Preparing'; });
  const reset = () => btns.forEach((b, i) => { b.disabled = false; b.textContent = labels[i]; });
  try {
    const blob = new Blob([makeZip(await packageFiles())], { type: 'application/zip' });
    if (STANDALONE) {
      const a = DOC.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'nadra-site.zip';
      DOC.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    } else {
      await DL.save({ filename: 'nadra-site.zip', data: blob });
    }
    DIRTY = false;
    const st = $('#adm-st');
    if (st) { st.textContent = STANDALONE ? 'Downloaded' : 'No unpublished changes'; st.classList.remove('dirty'); }
    toast('Package ready. Upload it to Netlify under Deploys.');
  } catch (e) {
    const c = e && e.code;
    if (c === 'declined') { reset(); return; }
    toast(c === 'extension_not_enabled' || c === 'rejected_extension' ? 'Saving zip files is not available in this view. Use your own website address followed by #/admin.'
      : c === 'rate_limited' ? 'Wait a moment, then try again.' : (e && e.message) || 'Could not create the package. Try again.', true);
  }
  reset();
}
function siteHtml() {
  const used = {};
  S.media.forEach(m => { if (MEDIA[m.id]) used[m.id] = MEDIA[m.id]; if (m.type === 'video' && MEDIA[m.id + '_p']) used[m.id + '_p'] = MEDIA[m.id + '_p']; });
  S.reviews.forEach(r => { if (r.photo && MEDIA[r.photo]) used[r.photo] = MEDIA[r.photo]; });
  return buildDocument($('#app-css').textContent, $('#app-js').textContent, S, used);
}
async function publish() {
  if (!ART) { toast('Publishing is not available in this view.', true); return; }
  const btn = $('#adm-pub');
  if (btn) { btn.disabled = true; btn.textContent = 'Publishing'; }
  const reset = () => { if (btn) { btn.disabled = false; btn.textContent = 'Publish changes'; } };
  const html = siteHtml();
  if (html.length > 15800000) { reset(); toast('The site is too large to publish. Delete some photos or videos.', true); return; }
  const was = DIRTY;
  DIRTY = false;
  try { sessionStorage.setItem('nadra-pub', '1'); } catch (e) { /* ignore */ }
  try { await ART.publish(html); } catch (e) {
    DIRTY = was; reset();
    try { sessionStorage.removeItem('nadra-pub'); } catch (x) { /* ignore */ }
    const c = e && e.code;
    toast(c === 'not_writer' || c === 'not_granted' ? 'Your account does not have permission to publish this site.'
      : c === 'too_large' ? 'The site is too large to publish. Delete some photos or videos.'
        : c === 'rate_limited' ? 'You are publishing too often. Wait a moment, then try again.'
          : c === 'conflict' ? 'Someone else published a newer version. The page will reload.'
            : 'Publishing failed. Check your connection and try again.', true);
  }
}

/* ---------- router ---------- */
function parseRoute() {
  const h = (location.hash || '').replace(/^#/, '') || '/', parts = h.split('?'), seg = parts[0].split('/').filter(Boolean), q = {};
  (parts[1] || '').split('&').forEach(kv => {
    if (!kv) return;
    const p = kv.split('=');
    try { q[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || ''); } catch (e) { /* ignore */ }
  });
  return { name: seg[0] || 'home', id: seg[1] ? decodeURIComponent(seg[1]) : '', q };
}
function viewFor(r) {
  switch (r.name) {
    case 'home': return viewHome();
    case 'services': return r.id ? viewCategory(r.id) : viewServices();
    case 'gallery': return viewGallery();
    case 'about': return viewAbout();
    case 'book': return viewBook();
    case 'contact': return viewContact();
    case 'admin': return viewAdmin();
    default: return viewNotFound();
  }
}
function titleFor(r) {
  const n = S.settings.name, T = { services: 'Services', gallery: 'Gallery', about: 'About', book: 'Book an appointment', contact: 'Contact', admin: 'Admin' };
  let t = T[r.name] || '';
  if (r.name === 'services' && r.id) { const c = cat(r.id); t = c ? c.name + ' in Kasarani' : 'Services'; }
  return t ? t + ' - ' + n : n + ' - Barbershop and Spa in Kasarani, Thika Road, Nairobi';
}
function render() {
  R = parseRoute();
  DOC.body.classList.toggle('is-admin', R.name === 'admin');
  root.innerHTML = '<a class="skip" href="#main" data-act="skip">Skip to content</a>' + header() + `<main id="main" tabindex="-1">${viewFor(R)}</main>` + footer() + (R.name === 'admin' ? '' : dock());
  applyMedia(root);
  DOC.title = titleFor(R);
}
function go(first) {
  const r = parseRoute(), prev = R;
  if (r.name === 'book') {
    if (prev.name !== 'book') BK.done = false;
    if (r.q.cat !== undefined) { BK.cat = r.q.cat; BK.svc = r.q.svc || ''; BK.done = false; }
  }
  DOC.documentElement.classList.remove('lock');
  render();
  if (first !== true) {
    window.scrollTo(0, 0);
    const m = $('#main');
    if (m) m.focus({ preventScroll: true });
  }
}

function toggleMenu(force) {
  const m = $('#mnav'), b = $('.menu-btn');
  if (!m || !b) return;
  const open = typeof force === 'boolean' ? force : m.hidden;
  m.hidden = !open;
  b.setAttribute('aria-expanded', String(open));
  DOC.documentElement.classList.toggle('lock', open);
}
function reBook() { rerender('#bk', bookForm()); }
function liveUpdate(t) {
  const r = t.dataset.r;

  if (r === 'title') {
    const it = t.closest('.it'), h = it && $('.it-h h3', it);

  } else if (r === 'cat') {
    const id = t.dataset.k.split(':')[1], c = cat(id), b = $('[data-act="adm-cat"][data-id="' + id + '"]');
    if (b && c) b.textContent = c.name + (c.hidden ? ' (hidden)' : '');

    const err = $('#rv-err');
    if (!RV.name.trim() || !RV.text.trim()) { if (err) err.textContent = 'Enter your name and your review.'; return; }
    window.open(waUrl(`Hello ${bn()}, I would like to leave a review.\n\nRating: ${RV.rating} out of 5\nReview: ${RV.text.trim()}\nName: ${RV.name.trim()}`), '_blank', 'noopener');
    closeModal();
    toast('Thank you. Tap Send in WhatsApp to share your review.');
  },
  'bk-cat'(t) {
    BK.cat = t.dataset.id;
    const x = S.services.find(s => s.id === BK.svc);
    if (!x || x.cat !== BK.cat) BK.svc = '';
    reBook();
  },
  'bk-svc'(t) { BK.svc = t.dataset.id; reBook(); },
  'bk-date'(t) { BK.date = t.dataset.d; BK.time = ''; reBook(); },
  'bk-time'(t) { BK.time = t.dataset.t; reBook(); },
  'bk-confirm'() {
    const errs = bkErrors(), box = $('#bk-err');
    if (errs.length) { if (box) { box.textContent = errs.join(' '); box.scrollIntoView({ block: 'center' }); } return; }
    BK.done = true;
    reBook();
    const h = $('#main h1');
    if (h) h.scrollIntoView();
    window.open(waUrl(msgBooking()), '_blank', 'noopener');
  },
  'bk-edit'() { BK.done = false; reBook(); },
  'ct-wa'() { if (contactCheck()) window.open(waUrl(contactMessage()), '_blank', 'noopener'); },
  'ct-mail'() {
    if (!contactCheck()) return;
    window.open('mailto:' + S.settings.email + '?subject=' + encodeURIComponent('Website enquiry') + '&body=' + encodeURIComponent(contactMessage().replace(/^Hello [^,]*, /, '')), '_self');
  },

  /* admin */
  'adm-tab'(t) { ADM.tab = t.dataset.id; ADM.del = ''; admRender(); window.scrollTo(0, 0); },
  'adm-cat'(t) { ADM.cat = t.dataset.id; ADM.del = ''; admRender(); },
  'adm-gf'(t) { ADM.gcat = t.dataset.id; admRender(); },
  'cat-add'() {
    const c = { id: uid('cat'), name: 'New category', blurb: '', phrase: '', cover: '', hidden: false };
    S.categories.push(c); ADM.cat = c.id; markDirty(); admRender();
  },
  'cat-up'(t) { swap(S.categories, t.dataset.id, -1, () => true); markDirty(); admRender(); },
  'cat-down'(t) { swap(S.categories, t.dataset.id, 1, () => true); markDirty(); admRender(); },
  'svc-add'() {
    S.services.push({ id: uid('svc'), cat: ADM.cat, name: 'New treatment', desc: '', price: '', duration: '', hidden: false });
    markDirty(); admRender();
  },
  'svc-up'(t) { swap(S.services, t.dataset.id, -1, x => x.cat === ADM.cat); markDirty(); admRender(); },
  'svc-down'(t) { swap(S.services, t.dataset.id, 1, x => x.cat === ADM.cat); markDirty(); admRender(); },
  del(t) { ADM.del = t.dataset.kind + ':' + t.dataset.id; admRender(); },
  'del-x'() { ADM.del = ''; admRender(); },
  'del-go'(t) { deleteItem(t.dataset.kind, t.dataset.id); ADM.del = ''; admRender(); },
  cover(t) {
    const m = S.media.find(x => x.id === t.dataset.id), c = m && cat(m.cat);
    if (c) { c.cover = m.id; markDirty(); admRender(); toast('Cover photo set.'); }
  },
  'rev-add'() { S.reviews.push({ id: uid('rev'), name: '', rating: 5, text: '', photo: '' }); markDirty(); admRender(); },
  'rev-nophoto'(t) {
    const r = S.reviews.find(x => x.id === t.dataset.id);
    if (r && r.photo) { delete MEDIA[r.photo]; r.photo = ''; markDirty(); admRender(); }
  },
  'hero-x'() { const h = heroMedia(); if (h) removeMedia(h.id); markDirty(); admRender(); },
  'hl-add'() { S.settings.highlights.push({ title: '', text: '' }); markDirty(); admRender(); },
  'hl-del'(t) { S.settings.highlights.splice(+t.dataset.id, 1); markDirty(); admRender(); },
  'bk-add'() {
    if (!NB.name.trim() && !NB.svc.trim()) { toast('Enter a customer name or a service.', true); return; }
    LED.push({ id: uid('b'), svc: NB.svc.trim(), date: NB.date, time: NB.time, name: NB.name.trim(), phone: NB.phone.trim(), notes: NB.notes.trim(), status: 'Pending' });
    NB = { svc: '', date: '', time: '', name: '', phone: '', notes: '' };
    saveLed(); admRender();
  },
  pkg: exportPackage,
  publish
};

DOC.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const fn = ACT[t.dataset.act];
  if (fn) fn(t, e);
});
DOC.addEventListener('input', e => {
  const t = e.target, d = t.dataset;
  if (d.bk && d.bk !== 'date') BK[d.bk] = t.value;
  else if (d.ct) CT[d.ct] = t.value;
  else if (d.rv) RV[d.rv] = t.value;
  else if (d.nb) NB[d.nb] = t.value;
  else if (d.k && t.type !== 'checkbox' && t.tagName !== 'SELECT') { admBind(t); liveUpdate(t); }
});
DOC.addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  if (d.bk === 'date') { BK.date = t.value; BK.time = ''; reBook(); }
  else if (d.nb) NB[d.nb] = t.value;
  else if (d.adm === 'upCat') ADM.upCat = t.value;
  else if (d.up) handleUpload(t);
  else if (d.k) { admBind(t); liveUpdate(t); if (d.r === 'all') admRender(); }
});
DOC.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if ($('#lb')) closeLB();
    else if ($('#modal')) closeModal();
    else { const m = $('#mnav'); if (m && !m.hidden) toggleMenu(false); }
  } else if (LB && e.key === 'ArrowRight') stepLB(1);
  else if (LB && e.key === 'ArrowLeft') stepLB(-1);
  else if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
    const d = e.target.dataset;
    if (d.bk) { e.preventDefault(); const b = $('[data-act="bk-confirm"]'); if (b) b.click(); }
    else if (d.ct) { e.preventDefault(); const b = $('[data-act="ct-wa"]'); if (b) b.click(); }
  } else if (e.key === 'Tab') {
    const box = $('#lb') || $('#modal');
    if (!box) return;
    const fs = $$('button,[href],input,textarea,select', box).filter(x => !x.disabled);
    if (!fs.length) return;
    const a = fs[0], z = fs[fs.length - 1];
    if (e.shiftKey && DOC.activeElement === a) { e.preventDefault(); z.focus(); }
    else if (!e.shiftKey && DOC.activeElement === z) { e.preventDefault(); a.focus(); }
  }
});
DOC.addEventListener('load', e => {
  const t = e.target;
  if (t && t.classList && t.classList.contains('mapf')) setTimeout(() => { if (!t.classList.contains('bad')) t.classList.add('ok'); }, 80);
}, true);
DOC.addEventListener('securitypolicyviolation', e => {
  if (/frame|child/.test(e.violatedDirective || '') || /google\.com\/maps/.test(e.blockedURI || '')) $$('.mapf').forEach(f => f.classList.add('bad'));
});
window.addEventListener('hashchange', () => go());
window.addEventListener('beforeunload', e => { if (DIRTY) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- owner access ---------- */
async function initAdmin() {
  try {
    if (STANDALONE) { ADM_CHECKED = true; return; }
    const res = await Promise.all([window.claude.use('user'), window.claude.use('artifact'), window.claude.use('downloads')]);
    ADM_CHECKED = true;
    if (res[0] && res[1] && await res[0].canEdit()) { ART = res[1]; DL = res[2] || null; ADMIN = true; }
    if (ADMIN || R.name === 'admin') { const y = window.scrollY; render(); window.scrollTo(0, y); }
  } catch (e) { ADM_CHECKED = true; }
}

/* ---------- start ---------- */
if (DOC.readyState === 'loading') DOC.addEventListener('DOMContentLoaded', loadMedia); else loadMedia();
go(true);
initAdmin();
try { if (sessionStorage.getItem('nadra-pub')) { sessionStorage.removeItem('nadra-pub'); setTimeout(() => toast('Published. Your changes are live.'), 400); } } catch (e) { /* ignore */ }

})();
</script>
